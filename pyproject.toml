[project]
name = "hexa-sec"
version = "0.1.0"
description = "hexa-sec — AI-powered security audit pack. Orchestrates market scanners and correlates their findings (hexagonal + DDD)."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp (>=2.1.1,<3.0.0)",
    "click>=8.3",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
hexa-sec = "hexa_sec.infrastructure.adapters.primary.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
    "maturin>=1.5,<2.0",
    "types-pyyaml>=6.0",
    "mutmut>=3.7,<4",
]

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "hexa-sec"
version = "0.1.0"
description = "hexa-sec — AI-powered security audit pack (hexagonal core)"
packages = [{ include = "hexa_sec", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=5.0"
ruff = ">=0.8"
mypy = ">=1.13"
pyyaml = ">=6.0"
httpx = ">=0.27"
maturin = ">=1.5,<2.0"
types-pyyaml = ">=6.0"
mutmut = ">=3.7,<4"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires real scanners in a local lab, not CI",
    "e2e: full flow mandate→scan→correlate→report, release CI only",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "N"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["hexa_sec", "hexa_guard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["hexa_guard"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["hexa_sec"]
omit = [
    "hexa_sec/tests/*",
    "tests/*",
]

[tool.coverage.report]
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "def __repr__",
    "@(overload)",
]

[tool.mutmut]
# Mutation testing — deterministic core + configuration/persistence wiring.
# The primary adapters (MCP/CLI) pull in the mcp SDK whose cryptography layer
# is not fork-safe under mutmut's sandbox, and the remaining secondary adapters
# are thin translations already gated by branch coverage. The sqlite report/audit
# store is mutated because it is real data-access logic (SQL + tenant isolation).
# The tests selected below are the pure unit tests that exercise the mutated
# code — no scanner, Docker or network is ever involved.
source_paths = ["src/hexa_sec"]
also_copy = ["scripts", "datasets", "packs", "hexa_guard.py"]
only_mutate = [
    "src/hexa_sec/domain/*",
    "src/hexa_sec/application/service/*",
    "src/hexa_sec/infrastructure/config/*",
    "src/hexa_sec/infrastructure/bootstrap/*",
    "src/hexa_sec/infrastructure/adapters/secondary/report_store/*",
]
do_not_mutate = [
    "src/hexa_sec/domain/*/__init__.py",
    "src/hexa_sec/application/service/__init__.py",
    "src/hexa_sec/infrastructure/config/__init__.py",
    "src/hexa_sec/infrastructure/bootstrap/__init__.py",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/domain",
    "tests/unit/application",
    "tests/unit/infrastructure/test_container.py",
    "tests/unit/infrastructure/test_env_contract.py",
    "tests/unit/infrastructure/adapters/test_sqlite_report_store.py",
    "-m",
    "not integration and not e2e",
]
mutate_only_covered_lines = true
