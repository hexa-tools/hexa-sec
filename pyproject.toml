[project]
name = "hexa-sec"
version = "0.1.0"
description = "hexa-sec — AI-powered security audit pack. Orchestrates market scanners and correlates their findings (hexagonal + DDD)."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp (>=2.1.1,<3.0.0)",
    "click>=8.3",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
hexa-sec = "hexa_sec.adapters.primary.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
    "maturin>=1.5,<2.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "hexa-sec"
version = "0.1.0"
description = "hexa-sec — AI-powered security audit pack (hexagonal core)"
packages = [{ include = "hexa_sec", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=5.0"
ruff = ">=0.8"
mypy = ">=1.13"
pyyaml = ">=6.0"
httpx = ">=0.27"
maturin = ">=1.5,<2.0"
types-pyyaml = ">=6.0"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires real scanners in a local lab, not CI",
    "e2e: full flow mandate→scan→correlate→report, release CI only",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "N"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["hexa_sec", "hexa_guard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["hexa_guard"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["hexa_sec"]
omit = [
    "hexa_sec/tests/*",
    "tests/*",
]

[tool.coverage.report]
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "def __repr__",
    "@(overload)",
]
