# hexa-sec/packs/scanners.yml
# Inventory of all security scanners — each entry maps to an adapter.
# Family = the port (e.g., WebScannerPort, NetworkScannerPort).
# Type: local (dockerized), saas (API), offensive (mandate required).
#
# The rule: 1 adapter per tool — they are interchangeable.

families:
  web:
    description: "Web application scanners — OWASP Top 10, SQLi, XSS, auth"
    port: WebScannerPort
    tools:
      - name: web_vuln_scan_burp
        type: local
        docker: true
        description: "Burp Suite — comprehensive web app vulnerability scanning"
        questions:
          - "Scan the payment app with Burp for OWASP Top 10 vulnerabilities"
          - "Run an active scan on the admin portal and export findings"

      - name: web_vuln_scan_zap
        type: local
        docker: true
        image: zaproxy/zap-stable
        description: "OWASP ZAP — open-source web vulnerability scanner"
        questions:
          - "Run an automated ZAP scan against the staging environment"
          - "Check for SQLi and XSS with ZAP on the checkout service"

      - name: web_cve_templates_nuclei
        type: local
        docker: true
        image: projectdiscovery/nuclei
        digest: sha256:582d5546902e67052097cb2d07296c642d50a1afc5e44623cb038845df9a32eb
        description: "Nuclei — vulnerability templates scanner (ProjectDiscovery)"
        questions:
          - "Run nuclei against the public API endpoints with critical severity only"
          - "Scan the new microservice for known CVEs using nuclei templates"

      - name: web_wordpress_audit
        type: local
        docker: true
        image: wpscanteam/wpscan
        description: "WPScan — WordPress vulnerability and plugin scanner"
        questions:
          - "Check our WordPress site for vulnerable plugins and themes"
          - "WPScan the marketing site and report any high-risk issues"

      - name: web_server_misconfig_nikto
        type: local
        docker: true
        image: sullo/nikto
        description: "Nikto — web server misconfiguration and outdated files scanner"
        questions:
          - "Nikto scan the webserver for default files and outdated versions"

      - name: web_deep_scan_arachni
        type: local
        docker: true
        description: "Arachni — full-featured web application security scanner"
        questions:
          - "Run Arachni on the new API gateway for deep security analysis"

      - name: web_sql_injection_test
        type: offensive
        docker: true
        requires_mandate: true
        description: "sqlmap — automated SQL injection exploitation testing"
        questions:
          - "Test the login endpoint for SQL injection with sqlmap (mandate required)"

      - name: web_dir_bruteforce
        type: local
        docker: true
        description: "dirsearch — hidden directory and file discovery"
        questions:
          - "Find hidden admin paths on the main domain using dirsearch"

      - name: web_fuzzing_ffuf
        type: local
        docker: true
        image: ghcr.io/ffuf/ffuf
        description: "ffuf — fast fuzzing for directories, parameters, and subdomains"
        questions:
          - "Fuzz for subdomains on the corporate domain with ffuf"

      - name: web_dns_bruteforce_gobuster
        type: local
        docker: true
        image: oj/gobuster
        description: "Gobuster — brute-force directories and DNS subdomains"
        questions:
          - "Gobuster the main site for backup and config files"

      - name: web_command_injection_commix
        type: offensive
        docker: true
        requires_mandate: true
        description: "Commix — automated OS command injection testing"
        questions:
          - "Test the web endpoints for command injection with commix (mandate required)"
          - "Commix to detect OS command injection on the file upload API (mandate)"

      - name: web_xss_advanced
        type: offensive
        docker: true
        requires_mandate: true
        description: "XSStrike — advanced XSS payload detection"
        questions:
          - "Run XSStrike to detect XSS in the search parameter (mandate required)"

      - name: web_template_injection_tplmap
        type: offensive
        docker: true
        requires_mandate: true
        description: "Tplmap — Server-Side Template Injection (SSTI) detection"
        questions:
          - "Tplmap to detect SSTI on the profile page (mandate required)"

      - name: web_sql_injection_gui
        type: offensive
        docker: true
        requires_mandate: true
        description: "jSQL Injection — graphical SQL injection testing"
        questions:
          - "jSQL Injection to test the login form for SQLi (mandate)"

      - name: web_param_discovery_arjun
        type: offensive
        docker: true
        requires_mandate: true
        description: "Arjun — hidden HTTP parameter discovery"
        questions:
          - "Arjun to discover hidden parameters on the payment API (mandate)"

      - name: web_fuzzing_wfuzz
        type: offensive
        docker: true
        requires_mandate: true
        description: "Wfuzz — web fuzzing for parameters and payloads"
        questions:
          - "Wfuzz to fuzz the API for injection points (mandate)"

      - name: web_api_discovery_kiterunner
        type: local
        docker: true
        description: "Kiterunner — API endpoint / route discovery"
        questions:
          - "Kiterunner to discover hidden API routes on the service"

      - name: web_historical_urls
        type: local
        docker: true
        description: "waybackurls / gau — historical URLs and endpoints from archives"
        questions:
          - "gau to gather historical URLs of the target for recon"

      - name: web_http_probe_httpx
        type: local
        docker: true
        image: projectdiscovery/httpx
        description: "httpx — fast HTTP probing (ProjectDiscovery)"
        questions:
          - "httpx to probe the discovered hosts for live endpoints"

